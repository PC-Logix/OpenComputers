plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
    id 'idea'
    id 'scala'
}

group = mod_group_id

// GitHub tags are the canonical release version.
// Tags use a leading "v" (for example v1.9.2), but the actual
// Gradle/mod/Maven version must not include that prefix.
//
// - GitHub tag v1.9.2      -> 1.9.2
// - Jenkins build 154      -> 1.9.2-dev.154
// - GitHub CI build 154    -> 1.9.2-dev.154
// - Local build            -> 1.9.2-dev.local
def githubTag = System.getenv('GITHUB_REF_TYPE') == 'tag'
        ? System.getenv('GITHUB_REF_NAME')?.replaceFirst(/^v/, '')
        : null

// Non-release builds identify the current development line plus the CI build.
// Jenkins provides BUILD_NUMBER; GitHub Actions provides GITHUB_RUN_NUMBER.
def ciBuildNumber = findProperty('build_number') ?:
        System.getenv('BUILD_NUMBER') ?:
        System.getenv('GITHUB_RUN_NUMBER') ?:
        'local'

version = githubTag ?: "${mod_version}-dev.${ciBuildNumber}"


base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

configurations {
    embedded
    requiredMods
    compileClasspath.extendsFrom embedded
    runtimeClasspath.extendsFrom embedded
    runtimeClasspath.extendsFrom requiredMods
    implementation.extendsFrom embedded
}

sourceSets {
    register("data") {
        def main = sourceSets.main
        it.compileClasspath += main.compileClasspath
        it.runtimeClasspath += main.runtimeClasspath
        project.dependencies.add(it.implementationConfigurationName, main.output)
    }
}

neoForge {
    version = project.neoforge_version

    parchment {
        mappingsVersion = project.mapping_version
        minecraftVersion = project.minecraft_version
    }

    accessTransformers {
        file('src/main/resources/META-INF/accesstransformer.cfg')
    }

    mods {
        register("opencomputers") {
            sourceSet sourceSets.main
        }

        register("opencomputersData") {
            sourceSet sourceSets.main
            sourceSet sourceSets.data
        }

    }

    runs {
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
            loadedMods = [mods.opencomputers]
        }

        client {
            client()

            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()

            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            programArgument '--nogui'
        }

        gameTestServer {
            type = "gameTestServer"

            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()

            loadedMods = [mods.opencomputersData]
            programArguments.addAll(
                '--mod', project.mod_id,
                '--all',
                '--output', file('src/main/generatedResources/').getAbsolutePath(),
                '--existing', file('src/main/resources/').getAbsolutePath()
            )
        }
    }
}

sourceSets.main.resources {
    srcDir 'src/main/generatedResources'
    exclude '.cache/**'
}

tasks.named('processResources', ProcessResources).configure {
    from('LICENSE') {
        into 'META-INF'
    }
    from('LICENSES') {
        into 'META-INF/licenses'
    }
}

repositories {
    mavenCentral()
    maven {
        name "MightyPirates"
        url "https://maven.cil.li/"
        metadataSources {
            mavenPom()
            artifact()
        }
    }
    maven {
        url "https://maven.squiddev.cc"
        content {
            includeGroup "cc.tweaked"
        }
    }
    maven {
        url "https://api.modrinth.com/maven"
        content {
            includeGroup "maven.modrinth"
        }
    }
    maven {
        url "https://cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
    maven {
        url "https://modmaven.dev"
        content {
            includeGroup "mezz.jei"
            includeGroup 'appeng'
        }
    }
    maven {
        url "https://chickenbones.net/maven/"
        content {
            includeGroup "codechicken"
            includeGroup "mrtjp"
        }
    }
    maven {
        url "https://modmaven.dev/"
        content {
            includeGroup "appeng"
            includeGroup "mekanism"
        }
    }
    maven {
        url "https://proxy-maven.covers1624.net/"
        content {
            includeModule "net.minecraftforge", "Scorge"
        }
    }
    maven {
        name = "kotori316"
        url = "https://maven.kotori316.com"
    }
    maven {
        name = "Jared's maven"
        url = "https://maven.blamejared.com/"
    }
    maven {
        url = "https://maven.createmod.net"
    }
    maven {
        url = "https://maven.ithundxr.dev/mirror"
    }
    maven { url = "https://maven.ithundxr.dev/snapshots" } // Registrate
    flatDir { dirs 'libs' }
}

dependencies {
    compileOnly("org.scala-lang:scala-library:2.13.12")
    compileOnly("org.typelevel:cats-core_2.13:2.8.1-kotori")
    requiredMods("com.kotori316:scalablecatsforce-neoforge:3.3.3-build-15:with-library") {
        transitive(false)
    }

    embedded "com.typesafe:config:1.4.5"
    embedded ":OC-LuaJ:20220907.1"
    embedded ":OC-JNLua-Natives:20220928.1"

    // ModDevGradle 2.x only discovers actual mods from the normal runtime
    // classpath on Minecraft 1.21.1. These are plain Java libraries that OC
    // embeds into its release jar, so they must also be explicitly added to
    // the development run's additional runtime classpath.
    additionalRuntimeClasspath "com.typesafe:config:1.4.5"
    additionalRuntimeClasspath ":OC-LuaJ:20220907.1"
    additionalRuntimeClasspath ":OC-JNLua-Natives:20220928.1"

    def jeiSlug = "jei-${minecraft_version}"

    // Jade
    compileOnly("curse.maven:jade-324717:${jade_version}")

    // CC: Tweaked
    compileOnly("cc.tweaked:cc-tweaked-${minecraft_version}-common-api:${cct_version}")
    compileOnly("cc.tweaked:cc-tweaked-${minecraft_version}-core-api:${cct_version}")
    compileOnly("cc.tweaked:cc-tweaked-${minecraft_version}-forge-api:${cct_version}")
    runtimeOnly("cc.tweaked:cc-tweaked-${minecraft_version}-forge:${cct_version}")

    // Modern Fix
    runtimeOnly("maven.modrinth:modernfix:${modernfix_version}")

    // CoFH & Thermal
    // not currently available for 1.21+
//    compileOnly("curse.maven:cofh-core-69162:4801048")
//    compileOnly("curse.maven:thermal-foundation-222880:4788649")

    // Create
    implementation("com.simibubi.create:create-${minecraft_version}:${create_version}:slim") { transitive = false }
    implementation("net.createmod.ponder:ponder-neoforge:${ponder_version}+mc${minecraft_version}")
    // Create's MovementBehaviour API exposes Registrate's NonNullConsumer in
    // a method signature. Keep it available while compiling the optional OC
    // Create bridge as well as at dev-runtime.
    compileOnly("com.tterrag.registrate:Registrate:${registrate_version}")
    compileOnly("dev.engine-room.flywheel:flywheel-neoforge-${minecraft_version}:${flywheel_version}")
    runtimeOnly("dev.engine-room.flywheel:flywheel-neoforge-${minecraft_version}:${flywheel_version}")
    runtimeOnly("com.tterrag.registrate:Registrate:${registrate_version}")
    compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:0.4.1"))

    // AE2
    compileOnly("org.appliedenergistics:appliedenergistics2:${ae2_version}:api")

    // Mekanism
    compileOnly("mekanism:Mekanism:${mekanism_version}:api")
    runtimeOnly("mekanism:Mekanism:${mekanism_version}")
    runtimeOnly("mekanism:Mekanism:${mekanism_version}:generators")

    // JEI
    compileOnly("mezz.jei:${jeiSlug}-neoforge-api:${jei_version}")
    runtimeOnly("mezz.jei:${jeiSlug}-neoforge:${jei_version}")

    // CodeChicken
    compileOnly("curse.maven:cb-multipart-258426:5292585")
    compileOnly("curse.maven:codechicken-lib-1-8-242818:5753868")

    // EnderStorage
    compileOnly("curse.maven:ender-storage-1-8-245174:5292573")

    // Project: Red
    compileOnly("mrtjp:ProjectRed:${projred_version}:core")
    compileOnly("mrtjp:ProjectRed:${projred_version}:api")

    testImplementation("org.scala-lang:scala-library:2.13.12")
    testImplementation("org.scalatest:scalatest_2.13:3.2.18")
    testImplementation("org.scalatestplus:junit-4-13_2.13:3.2.18.0")
    testImplementation("junit:junit:4.13.2")
    testRuntimeOnly("org.apache.maven:maven-artifact:3.8.5")
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            groupId = mod_group_id
            artifactId = mod_id
            version = project.version
        }
    }

    repositories {
        maven {
            name = "michiyo"
            url = uri("https://maven.michiyo.me/releases/")
            credentials {
                username = findProperty("maven_user")
                password = findProperty("maven_password")
            }
        }
    }
}

afterEvaluate {
    publishing {
        publications {
            mavenJava(MavenPublication) {
                artifact(provider {
                    tasks.named("jar").get().outputs.files.singleFile
                }) {
                    builtBy tasks.named("jar")
                    classifier = null
                    extension = "jar"
                }
                artifact(tasks.named("apiJar")) {
                    classifier = 'api'
                    extension = "jar"
                }
                artifact(tasks.named("apiSourcesJar")) {
                    classifier = 'sources'
                    extension = "jar"
                }
            }
        }
    }
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neoforge_version       : neoforge_version,
            neoforge_version_range : neoforge_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : project.version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]

    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/data/sources/modMetadata"
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.named("createMinecraftArtifacts").configure {
    dependsOn(generateModMetadata)
}

tasks.named('jar', Jar).configure {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest {
        attributes(["Specification-Title"     : mod_id,
                    "Specification-Vendor"    : mod_authors,
                    "Specification-Version"   : "1",
                    "Implementation-Title"    : project.name,
                    "Implementation-Version"  : project.jar.archiveVersion,
                    "Implementation-Vendor"   : mod_authors,
                    "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")])
    }

    from({
        configurations.embedded.collect { it.isDirectory() ? it : zipTree(it) }
    }) {
        exclude 'META-INF', 'META-INF/**'
    }

//    finalizedBy 'reobfJar'
}

tasks.register('copyRequiredMods', Copy) {
    from configurations.requiredMods
    into layout.buildDirectory.dir('libs')
}

tasks.named('assemble') {
    dependsOn tasks.named('copyRequiredMods')
}

tasks.register('apiJar', Jar) {
    archiveClassifier = 'api'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from sourceSets.main.output
    include 'li/cil/oc/api/**'
    from('LICENSE') {
        into 'META-INF'
    }
}

tasks.register('apiSourcesJar', Jar) {
    archiveClassifier = 'sources'
    from sourceSets.main.allJava
    include 'li/cil/oc/api/**'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('test', Test).configure {
    classpath += sourceSets.main.compileClasspath
}

tasks.withType(ScalaCompile).configureEach {
    scalaCompileOptions.forkOptions.memoryMaximumSize = '2g'
    scalaCompileOptions.forkOptions.jvmArgs = ['-Xss4m']
}
